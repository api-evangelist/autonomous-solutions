openapi: 3.2.0
info:
  title: Vencart Banners API
  version: 0.1.0
tags:
- name: banners
paths:
  /hubs/owner/banners:
    get:
      tags:
      - banners
      summary: List Hub Banners
      operationId: list_hub_banners_hubs_owner_banners_get
      parameters:
      - name: hub_id
        in: query
        required: true
        schema:
          type: integer
          title: Hub Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - banners
      summary: Create Hub Banner
      operationId: create_hub_banner_hubs_owner_banners_post
      parameters:
      - name: hub_id
        in: query
        required: true
        schema:
          type: integer
          title: Hub Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_hub_banner_hubs_owner_banners_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /hubs/owner/banners/{banner_id}:
    delete:
      tags:
      - banners
      summary: Delete Hub Banner
      operationId: delete_hub_banner_hubs_owner_banners__banner_id__delete
      parameters:
      - name: banner_id
        in: path
        required: true
        schema:
          type: integer
          title: Banner Id
      - name: hub_id
        in: query
        required: true
        schema:
          type: integer
          title: Hub Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Body_create_hub_banner_hubs_owner_banners_post:
      properties:
        name:
          type: string
          title: Name
        order_by:
          type: integer
          title: Order By
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - name
      - order_by
      - file
      title: Body_create_hub_banner_hubs_owner_banners_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
