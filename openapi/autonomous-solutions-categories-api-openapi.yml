openapi: 3.2.0
info:
  title: Vencart Categories API
  version: 0.1.0
tags:
- name: Categories
paths:
  /hub-categories:
    get:
      tags:
      - Categories
      summary: Get Categories By Hub
      operationId: get_categories_by_hub_hub_categories_get
      parameters:
      - name: hub_id
        in: query
        required: true
        schema:
          type: integer
          title: Hub Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /hub-categories/{category_id}/subcategories:
    get:
      tags:
      - Categories
      summary: Get Subcategories Of Category
      operationId: get_subcategories_of_category_hub_categories__category_id__subcategories_get
      parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: integer
          title: Category Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
