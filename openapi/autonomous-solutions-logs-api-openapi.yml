openapi: 3.2.0
info:
  title: Vencart Logs API
  version: 0.1.0
tags:
- name: Logs
paths:
  /diag/logs/list:
    get:
      tags:
      - Logs
      summary: List Dir
      operationId: list_dir_diag_logs_list_get
      parameters:
      - name: path
        in: query
        required: false
        schema:
          type: string
          default: .
          title: Path
      - name: order
        in: query
        required: false
        schema:
          type: string
          default: date
          title: Order
      - name: reverse
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Reverse
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /diag/logs/view:
    get:
      tags:
      - Logs
      summary: View Logs
      operationId: view_logs_diag_logs_view_get
      parameters:
      - name: lines
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Lines
      - name: file
        in: query
        required: false
        schema:
          type: string
          title: File
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /diag/logs/stream:
    get:
      tags:
      - Logs
      summary: View Logs Stream
      operationId: view_logs_stream_diag_logs_stream_get
      parameters:
      - name: file
        in: query
        required: false
        schema:
          type: string
          title: File
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /diag/logs/monitor:
    get:
      tags:
      - Logs
      summary: Monitor Logs
      operationId: monitor_logs_diag_logs_monitor_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
